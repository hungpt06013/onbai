@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Dark mode styles */
body.dark {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%) !important;
  color: #e2e8f0;
}
body.dark .bg-white { background-color: #1e2535 !important; }
body.dark .bg-gray-50 { background-color: #252d3d !important; }
body.dark .bg-blue-50 { background-color: #1e3a5f !important; }
body.dark .bg-green-50 { background-color: #1a3a2a !important; }
body.dark .bg-red-50 { background-color: #3a1a1a !important; }
body.dark .bg-yellow-50 { background-color: #3a2e0a !important; }
body.dark .border-yellow-300 { border-color: #854d0e !important; }
body.dark .text-yellow-900 { color: #fef08a !important; }
body.dark .text-yellow-800 { color: #fde047 !important; }
body.dark .border-yellow-400 { border-color: #854d0e !important; }
body.dark .text-yellow-700 { color: #fde047 !important; }
/* Explain boxes in dark mode */
body.dark .bg-blue-50 { background-color: #1e3a5f !important; }
body.dark .border-blue-200 { border-color: #1d4ed8 !important; }
body.dark .text-blue-900 { color: #93c5fd !important; }

/* Hint box base (light mode) */
.hint-box {
  background-color: #fffbeb;
  border: 1px solid #f59e0b;
  color: #92400e;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 10px;
}
/* Hint box dark mode */
body.dark .hint-box {
  background-color: #3a2e0a !important;
  border-color: #b45309 !important;
  color: #fde68a !important;
}
/* Explain box base (light mode) */
.explain-box {
  background-color: #f0f9ff;
  border: 1px solid #7dd3fc;
  color: #0369a1;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 10px;
}
/* Explain box dark mode */
body.dark .explain-box {
  background-color: #0f2942 !important;
  border-color: #3b82f6 !important;
  color: #e0f2fe !important;
}
body.dark .text-gray-800 { color: #e2e8f0 !important; }
body.dark .text-gray-700 { color: #cbd5e1 !important; }
body.dark .text-gray-600 { color: #94a3b8 !important; }
body.dark .text-gray-500 { color: #64748b !important; }
body.dark .border-gray-200 { border-color: #334155 !important; }
body.dark .border-b { border-color: #334155 !important; }
body.dark .border { border-color: #334155 !important; }
body.dark .shadow-xl, body.dark .shadow-2xl, body.dark .shadow-lg { box-shadow: 0 4px 24px rgba(0,0,0,0.5) !important; }
body.dark .rounded-3xl, body.dark .rounded-2xl { background-color: #1e2535; }
body.dark input[type="number"] { background: #252d3d; color: #e2e8f0; border-color: #334155; }
body.dark .bg-gray-300 { background-color: #374151 !important; }
body.dark .text-gray-500 { color: #9ca3af !important; }
body.dark .bg-blue-600 { background-color: #2563eb !important; }
</style>

    {"type":"tf","q":"Bài 15 – Câu 11: Nhà Lý xây dựng đất nước (phần 1)","statements":["Chính quyền trung ương và địa phương thời Lý ngày càng kiện toàn hơn.","Thời Lý, đứng đầu chính quyền trung ương là vua; dưới vua có các quan đại thần (quan văn, quan võ).","Thời Lý, vua ở ngôi theo chế độ \"cha truyền con nối\".","Ở địa phương, nhà Lý chia cả nước thành 12 (lộ/phủ) và đặt các chức quan tri phủ, tri châu."],"answers":[true,true,true,false]},
    {"type":"tf","q":"Bài 15 – Câu 12: Nhà Lý xây dựng đất nước (phần 2)","statements":["Để củng cố quốc gia thống nhất, nhà Lý đã thực hiện các chính sách đối nội, đối ngoại mềm dẻo nhưng kiên quyết.","Nhà Lý kiên quyết trấn áp những thế lực có mưu đồ tách khỏi Đại Việt.","Nhà Lý thần phục nhà Tống và Chăm-pa.","Quốc Tử Giám là nơi học tập của con em quý tộc, sau đó mở rộng đến con em quan lại và những người giỏi trong nước."],"answers":[true,true,false,true]},
    {"type":"tf","q":"Bài 15 – Câu 13: Kháng chiến chống xâm lược Tống (1075–1077)","statements":["Trận quyết chiến chiến lược trên phòng tuyến sông Như Nguyệt đã đánh tan cuộc xâm lược của quân Tống.","Chiến thắng Như Nguyệt đã bảo vệ vững chắc nền độc lập dân tộc.","Chiến thắng Như Nguyệt đã thể hiện tinh thần đoàn kết, quyết tâm chống ngoại xâm của nhân dân Đại Việt.","Chiến thắng Như Nguyệt thể hiện sự lãnh đạo tài ba của Lý Công Uẩn."],"answers":[true,true,true,false]},
    {"type":"tf","q":"Bài 16 – Câu 1: Tình hình chính trị thời Trần","statements":["Chế độ Thái Thượng hoàng giúp củng cố quyền lực của vua Trần.","Tăng cường quản lý chặt chẽ các địa phương miền núi và biên viễn.","Không có các quy định pháp luật cụ thể được ban hành.","Triều đình áp dụng chính sách \"ngụ binh ư nông\" để bảo vệ đất nước."],"answers":[true,true,false,false]},
    {"type":"tf","q":"Bài 16 – Câu 2: Các tầng lớp xã hội thời Trần","statements":["Tầng lớp nông nô làm việc trong các điền trang hoặc phục dịch quý tộc.","Nhân dân chủ yếu là thương nhân và thợ thủ công.","Quý tộc nắm giữ các chức vụ chủ chốt trong bộ máy nhà nước.","Công nhân là tầng lớp đông đảo nhất."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 16 – Câu 3: Hoàn cảnh thành lập nhà Trần","statements":["Nhà Lý suy yếu, phải dựa vào họ Trần để đánh dẹp các thế lực chống đối.","Họ Trần đánh thắng quân nhà Lương xâm lược nước ta.","Dân chúng cực khổ; tình trạng lụt lội, hạn hán, mất mùa liên tiếp xảy ra.","Đất nước thái bình, thịnh trị; đời sống nhân dân ổn định, phát triển."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 16 – Câu 4: Văn học thời Trần","statements":["Văn học chữ Nôm thời Trần đạt được những bước phát triển lớn.","Nguyễn Thuyên (Hàn Thuyên) là nhà thơ tiêu biểu viết bằng chữ Hán.","Văn học chữ Nôm góp phần khẳng định bản sắc văn hóa dân tộc.","Thơ văn thời Trần chỉ tập trung ca ngợi vua."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 16 – Câu 5: Khoa học – kỹ thuật thời Trần","statements":["Đại Việt sử ký là bộ quốc sử đầu tiên của Việt Nam.","Binh thư yếu lược do Chu Văn An biên soạn.","Tuệ Tĩnh nổi tiếng với nghiên cứu về cây thuốc Nam.","Việt sử lược là tác phẩm do Lê Văn Hưu biên soạn."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 16 – Câu 6: Nội dung KHÔNG phản ánh đúng hoàn cảnh thành lập nhà Trần","statements":["Nhà Lý suy yếu, phải dựa vào họ Trần để đánh dẹp các thế lực chống đối.","Dân chúng cực khổ; tình trạng lụt lội, hạn hán, mất mùa liên tiếp xảy ra.","Họ Trần đánh thắng quân nhà Lương xâm lược nước ta.","Đất nước thái bình, thịnh trị; đời sống nhân dân ổn định, phát triển."],"answers":[false,false,true,true]},
    {"type":"tf","q":"Bài 16 – Câu 7: Chính sách nông nghiệp thời Trần","statements":["Nhà Trần tích cực khai hoang để mở rộng diện tích canh tác.","Hạn chế các công trình thủy lợi để tập trung phát triển công nghiệp.","Giảm các loại thuế nặng cho nông dân, bao gồm thuế thân và thuế ruộng.","Các quý tộc không được phép khai hoang lập điền trang."],"answers":[true,false,false,false]},
    {"type":"tf","q":"Bài 16 – Câu 8: Thủ công nghiệp và thương nghiệp thời Trần","statements":["Các xưởng thủ công nhà nước sản xuất vũ khí và tiền tệ.","Các làng nghề truyền thống dần bị suy giảm dưới thời Trần.","Vân Đồn là trung tâm thương mại sầm uất.","Không có sự giao lưu thương mại với các nước láng giềng."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 16 – Câu 9: Tôn giáo thời Trần","statements":["Thiền phái Trúc Lâm Yên Tử do Trần Nhân Tông sáng lập.","Nho giáo hoàn toàn bị loại bỏ trong thời kỳ này.","Đạo giáo được coi trọng cùng với Phật giáo.","Phật giáo chỉ được quý tộc ủng hộ, không phổ biến trong nhân dân."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 16 – Câu 10: Nội dung KHÔNG phản ánh đúng văn học thời Trần","statements":["Văn học chữ Nôm thời Trần đạt được những bước phát triển lớn.","Nguyễn Thuyên (Hàn Thuyên) là nhà thơ tiêu biểu viết bằng chữ Hán.","Văn học chữ Nôm góp phần khẳng định bản sắc văn hóa dân tộc.","Thơ văn thời Trần chỉ tập trung ca ngợi vua."],"answers":[false,true,false,true]},
    {"type":"tf","q":"Bài 16 – Câu 11: Công cuộc xây dựng đất nước thời Trần (phần 1)","statements":["Pháp luật thời Trần đề cao sự nghiêm minh. Nhà nước ban hành bộ Quốc triều hình luật, các cơ quan pháp luật được tăng cường và hoàn thiện.","Nhà Trần khuyến khích khai khẩn đất hoang, mở rộng diện tích canh tác, đào sông ngòi, đắp đê phòng lụt, đặt các chức quan chuyên lo về nông nghiệp và thủy lợi.","Thăng Long là trung tâm sản xuất và buôn bán lớn nhất nước ta, có 36 phường sản xuất.","Cả nước được chia thành 24 lộ, phủ. Đơn vị hành chính ở địa phương phổ biến là tổng."],"answers":[true,true,false,false]},
    {"type":"tf","q":"Bài 16 – Câu 12: Công cuộc xây dựng đất nước thời Trần (phần 2)","statements":["Kinh tế thương nghiệp thời Trần khá phát triển: Thăng Long là trung tâm buôn bán lớn nhất; thuyền buôn ngoại quốc thường xuyên lui tới các cảng như Vân Đồn, Hội Thống, Hội Triều,...","Chu Văn An đỗ Thái học sinh và được vua Trần Minh Tông mời ra làm quan và dạy học tại Quốc Tử Giám.","Năm 1248, vua Trần cho đắp đê từ đầu nguồn đến cửa biển dọc các con sông lớn, gọi là đê Cơ Xá.","Tướng sĩ và địa chủ được ban thái ấp và cấp bổng lộc."],"answers":[true,true,false,false]},
    {"type":"tf","q":"Bài 16 – Câu 13: Đại Việt thời Trần (1226–1400)","statements":["Năm 1258, Quốc Tử Giám được mở rộng và thu nhận cả con cái thường dân vào học. Trường tư cũng được mở nhiều ở làng xã.","Bộ máy chính quyền trung ương và địa phương thời Trần hoàn thiện hơn thời Lý; đặc biệt tăng cường quản lí các khu vực miền núi và biên viễn.","Các vua Trần xưng Thái Thượng hoàng và không tham gia quản lí đất nước; các kì thi Nho học chưa được tổ chức quy củ.","Dòng thiền Trúc Lâm do Phật hoàng Trần Nhân Tông sáng lập."],"answers":[false,true,false,true]},
    {"type":"tf","q":"Bài 17 – Câu 1: Hội nghị Diên Hồng KHÔNG thể hiện ý nghĩa nào dưới đây","statements":["Nhà Trần biết đoàn kết với nhân dân để đánh giặc.","Nhà Trần sợ giặc Nguyên nên mới nhờ đến nhân dân.","Cuộc kháng chiến của nhà Trần là cuộc chiến tranh nhân dân.","Triều đình và nhân dân còn chưa đồng lòng đánh giặc."],"answers":[false,true,false,true]},
    {"type":"tf","q":"Bài 17 – Câu 2: Điểm chung về tinh thần chiến đấu của vua tôi nhà Trần","statements":["Quyết tâm đánh giặc, thể hiện sự đoàn kết của vua tôi nhà Trần.","Sự phân tranh giữa vua và các tướng lĩnh trong việc chống giặc.","Quân Mông – Nguyên mạnh cả về thế và lực so với quân ta.","Tinh thần đoàn kết, quyết chiến, không hòa hiếu với quân xâm lược."],"answers":[true,false,false,true]},
    {"type":"tf","q":"Bài 17 – Câu 3: Nội dung phản ánh đúng kế sách đánh giặc của nhà Trần","statements":["Nhà Trần chưa chủ động tấn công quân giặc.","Tích cực, chủ động chuẩn bị cho cuộc kháng chiến.","Tập trung đánh những chỗ mạnh của quân địch.","Rút lui chiến lược; chớp thời cơ để phản công."],"answers":[false,true,false,true]},
    {"type":"tf","q":"Bài 17 – Câu 4: Lí do nhà Trần không lựa chọn hòa hoãn với quân Nguyên","statements":["Vì lòng yêu nước nồng nàn, quyết không để mất đất.","Vì quân Trần luôn giữ vững tư tưởng đánh giặc đến cùng.","Vì quân Trần không có đủ lực lượng để chiến đấu.","Vì nhà Trần luôn sẵn sàng chấp nhận hòa bình với kẻ thù mạnh."],"answers":[true,true,false,false]},
    {"type":"tf","q":"Bài 17 – Câu 5: Ý nghĩa lịch sử ba lần chiến thắng quân Mông – Nguyên","statements":["Bảo vệ độc lập, chủ quyền và toàn vẹn lãnh thổ của Đại Việt.","Ngăn chặn sự xâm lược của Trung Quốc đối với các quốc gia Đông Nam Á.","Củng cố nền văn hóa Mông Cổ tại khu vực Đông Nam Á.","Để lại bài học về tinh thần đoàn kết và quyết chiến trong bảo vệ Tổ quốc."],"answers":[true,false,false,true]},
    {"type":"tf","q":"Bài 17 – Câu 6: Cuộc kháng chiến chống quân Mông Cổ năm 1258 thể hiện","statements":["Sự khéo léo trong việc sử dụng chiến thuật phòng thủ của quân Trần.","Sự liên kết mạnh mẽ của quân Mông Cổ và quân Trung Quốc trong việc tấn công Đại Việt.","Quyết tâm bảo vệ độc lập và chủ quyền của Đại Việt.","Sự yếu đuối của quân dân nhà Trần trong việc đối phó với kẻ thù."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 17 – Câu 7: Nội dung thể hiện chính xác nguyên nhân ba lần giặc Mông – Nguyên thất bại","statements":["Đường lối quân sự của Đại Việt rất độc đáo, linh hoạt, sáng tạo.","Lực lượng quân Mông – Nguyên ít, khí thế chiến đấu kém cỏi.","Đại Việt có đội ngũ tướng lĩnh tài giỏi với nhiều danh tiếng kiệt xuất.","Quân Mông – Nguyên không được nước nào viện trợ."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 17 – Câu 8: Nội dung KHÔNG phản ánh đúng kế sách đánh giặc của nhà Trần","statements":["Nhà Trần chưa chủ động tấn công quân giặc.","Tích cực, chủ động chuẩn bị cho cuộc kháng chiến.","Tập trung đánh những chỗ mạnh của quân địch.","Rút lui chiến lược; chớp thời cơ để phản công."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 17 – Câu 9: Nội dung KHÔNG thể hiện chính xác nguyên nhân ba lần giặc Mông – Nguyên thất bại","statements":["Đường lối quân sự của Đại Việt rất độc đáo, linh hoạt, sáng tạo.","Lực lượng quân Mông – Nguyên ít, khí thế chiến đấu kém cỏi.","Đại Việt có đội ngũ tướng lĩnh tài giỏi với nhiều danh tiếng kiệt xuất.","Quân Mông – Nguyên không được nước nào viện trợ."],"answers":[false,true,false,true]},
    {"type":"tf","q":"Bài 17 – Câu 10: Ý nghĩa câu nói của Trần Thủ Độ: \"Đầu thần chưa rơi xuống đất, xin bệ hạ đừng lo\"","statements":["Tinh thần quyết chiến chống giặc của Trần Thủ Độ.","Sự lo lắng của Trần Thủ Độ về sự thất bại của quân Trần.","Sự quyết tâm bảo vệ đất nước của Trần Thủ Độ.","Quân Mông – Nguyên quá mạnh nên ta chưa thể chủ động tấn công."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 17 – Câu 11: Diễn biến kháng chiến chống Mông – Nguyên (phần 1)","statements":["Năm 1257, Mông Cổ đã cho quân áp sát biên giới Đại Việt rồi ba lần cử sứ giả đến Thăng Long dụ hàng.","Cuối tháng 1 – 1258, quân Trần tổ chức phản công lớn ở Bình Lệ Nguyên (Vĩnh Phúc). Quân Mông Cổ thua trận rút chạy.","Năm 1271, Hốt Tất Liệt lập ra nhà Nguyên, ráo riết chuẩn bị xâm lược Đại Việt.","Đầu năm 1282, Thượng hoàng triệu phụ lão trong nước họp ở điện Diên Hồng, ban yến và hỏi kế đánh giặc."],"answers":[true,false,true,false]},
    {"type":"tf","q":"Bài 17 – Câu 12: Diễn biến kháng chiến chống Mông – Nguyên (phần 2)","statements":["\"Bệ hạ chém đầu thần trước rồi hãy hàng\" là câu nói của Trần Quốc Tuấn khi trả lời vua Trần Thánh Tông.","Năm 1289, Trần Quốc Tuấn được vua phong tước Hưng Đạo Đại Vương.","Trận Bạch Đằng (năm 1288) đã đánh tan cánh quân chở lương thảo của quân Nguyên.","Năm 1288, trên đường bộ, Thoát Hoan phải chui vào ống đồng bắt quân lính khiêng, tháo chạy về nước."],"answers":[false,true,false,true]},
    {"type":"tf","q":"Bài 17 – Câu 13: Những nhận định về cuộc kháng chiến chống Mông – Nguyên","statements":["Vào thế kỉ XII, đế chế Mông Cổ liên tiếp tiến hành các cuộc chiến tranh xâm lược và thống trị nhiều nước ở lục địa Á – Âu.","Đầu năm 1258, quân Mông Cổ do tướng Thoát Hoan chỉ huy từ Vân Nam tiến vào Đại Việt.","Tháng 5 – 1285, quân Trần tổ chức phản công, đánh bại quân giặc ở nhiều nơi như: Tây Kết, Hàm Tử, Chương Dương rồi tiến vào giải phóng Thăng Long, kết thúc thắng lợi cuộc kháng chiến.","Trong ba lần kháng chiến chống quân xâm lược Mông – Nguyên, kế sách \"vườn không nhà trống\" đều được nhà Trần sử dụng."],"answers":[false,false,true,true]}
  ]
};

    {"type":"mcq","q":"Ý nào không phản ánh đúng ý nghĩa sự kiện dời đô từ Hoa Lư về Đại La của Lý Công Uẩn?","o":["Khẳng định vị thế của Thăng Long – Hà Nội trong lịch sử dân tộc.","Tạo ra nhiều điều kiện thuận lợi để phát triển đất nước.","Mở ra thời kì mới trong sự phát triển của dân tộc.","Góp phần xây dựng quốc gia thống nhất."],"c":3},
    {"type":"mcq","q":"Bộ luật thành văn đầu tiên của nước Đại Việt có tên là","o":["Hình thư.","Hình luật.","Quốc triều hình luật.","Hoàng triều luật lệ."],"c":0},
    {"type":"mcq","q":"Ý nào dưới đây không phải là chính sách của nhà Lý trong việc xây dựng quân đội?","o":["Xây dựng quân đội với kỉ luật nghiêm minh, huấn luyện chu đáo.","Xây dựng quân đội với hai bộ phận: cấm quân và quân địa phương.","Quân đội được trang bị nhiều vũ khí hiện đại.","Thi hành chính sách \"ngụ binh ư nông\"."],"c":2},
    {"type":"mcq","q":"Đối với nhà Tống, chính sách đối ngoại mà nhà Lý thực hiện là","o":["quan hệ ngoại giao vừa mềm dẻo vừa cứng rắn để giữ vững chủ quyền quốc gia.","hòa hiếu, nộp triều cống đều đặn hằng năm, thần phục nhà Tống không điều kiện.","hòa hiếu, nộp triều cống nhưng luôn giữ tư thế của một quốc gia độc lập.","hợp tác bình đẳng, đôi bên cùng có lợi, luôn giữ tư thế là một quốc gia độc lập."],"c":2},
    {"type":"mcq","q":"Các vua nhà Lý cho dựng lầu chuông hai bên thềm điện Long Trì để","o":["người dân đánh chuông kêu oan ức.","triệu tập quý tộc, quan lại lúc cần thiết.","báo động triều đình khi có ngoại xâm.","thực hiện nghi thức trong Phật giáo."],"c":0},
    {"type":"mcq","q":"Nhà Lý gả công chúa và ban hành chức tước cho các tù trưởng dân tộc ít người nhằm","o":["thắt chặt tình đoàn kết giữa các dân tộc.","lấy lòng đồng bào dân tộc thiểu số.","thực hiện chính sách đa dân tộc, sắc tộc.","mở rộng thế lực và phạm vi ảnh hưởng."],"c":0},
    {"type":"mcq","q":"Ý nào sau đây không phản ánh đúng tình hình tư tưởng – tôn giáo thời Lý?","o":["Phật giáo được các vua Lý tôn sùng và truyền bá rộng rãi trong nhân dân.","Nho giáo bắt đầu được mở rộng.","Nho giáo chưa có vai trò trong đời sống xã hội.","Đạo giáo được truyền bá, kết hợp với các tín ngưỡng dân gian."],"c":2},
    {"type":"mcq","q":"Ý nào không phản ánh đúng việc làm của nhà Lý trước âm mưu xâm lược của nhà Tống (Trung Quốc)?","o":["Cử Lý Thường Kiệt là tổng chỉ huy cuộc kháng chiến.","Chủ động tiến hành các biện pháp đối phó.","Đạp tan ý đồ phối hợp tiến công của quân Tống với Chăm-pa.","Triệu tập hội nghị Bình Than (Bắc Ninh) để bàn kế sách đánh giặc."],"c":3},
    {"type":"mcq","q":"Nét độc đáo trong cuộc kháng chiến chống quân xâm lược Tống giai đoạn thứ nhất (1075) là","o":["tích cực luyện tập quân sĩ.","cho quân mai phục, sẵn sàng chiến đấu.","chủ động thực hiện chủ trương \"tiến công trước để tự vệ\".","chặn các ngả đường mà quân xâm lược có thể tiến vào."],"c":2},
    {"type":"mcq","q":"Lý Thường Kiệt xây dựng phòng tuyến chống quân Tống ở bờ nam sông Như Nguyệt vì","o":["sông Như Nguyệt vừa rộng và sâu nên quân giặc khó có thể vượt qua.","địa hình bên bờ bắc của sông Như Nguyệt không thuận lợi cho quân ta phòng ngự.","sông Như Nguyệt như một chiến hào tự nhiên khó có thể vượt qua.","sông Như Nguyệt có vị trí hiểm yếu, chặn ngang con đường bộ tiến vào Thăng Long."],"c":3},
    {"type":"mcq","q":"Nét độc đáo trong cách kết thúc cuộc kháng chiến của Lý Thường Kiệt là","o":["giả thua để cho quân giặc kiêu căng rồi bất ngờ phản công tiêu diệt chúng.","giam chân địch ở phía bờ bắc sông Như Nguyệt khiến chúng cạn kiệt lương thực, rệu rã tinh thần rồi bất ngờ mở trận tấn công quyết định.","kết hợp tấn công quân sự với vận động tâm lí để làm nhụt chí xâm lược của quân Tống.","khi địch lâm vào tình thế hết sức khó khăn, tuyệt vọng thì chủ động đề nghị giảng hòa để kết thúc chiến tranh."],"c":3},
    {"type":"mcq","q":"Ý nào không phản ánh đúng tác dụng trong cách kết thúc cuộc kháng chiến của Lý Thường Kiệt?","o":["Tránh được sự hi sinh xương máu của quân sĩ.","Bảo toàn được lực lượng của quân ta.","Làm cho quân Tống phải từ bỏ mộng xâm lược Đại Việt.","Góp phần giữ được mối quan hệ bang giao giữa Đại Việt và Tống."],"c":2},
    {"type":"mcq","q":"Điểm độc đáo trong bộ máy nhà nước thời Trần là","o":["các vua lên ngôi khi còn nhỏ tuổi.","các chức vụ quan trọng trong triều đều do những người đỗ đạt nắm giữ.","các vua Trần thường nhường ngôi sớm, xưng là Thái thượng hoàng, hỗ trợ vua (con) trị nước.","nhiều cơ quan và chức quan mới được lập ra."],"c":2},
    {"type":"mcq","q":"Điểm giống nhau về tổ chức quân đội thời Lý với thời Trần là","o":["thực hiện chính sách \"ngụ binh ư nông\".","thực hiện nền quốc phòng toàn dân.","xây dựng theo hướng \"đông đảo, tinh nhuệ\".","xây dựng theo hướng \"cốt tinh nhuệ, không cốt đông\"."],"c":0},
    {"type":"mcq","q":"Chủ trương \"binh lính cốt tinh nhuệ, không cốt đông\" có nghĩa là","o":["quan trọng là số lượng binh lính, không quan trọng chất lượng.","quan trọng là chất lượng binh lính, không quan trọng số lượng.","cả chất lượng và số lượng binh lính đều quan trọng.","không xem trọng chất lượng và số lượng."],"c":1},
    {"type":"mcq","q":"Biểu hiện nào cho thấy dưới thời Trần hoạt động sản xuất thủ công nghiệp đã bước đầu mang tính chuyên môn hóa?","o":["Hình thành các công trường thủ công.","Xuất hiện nhiều thợ thủ công giỏi.","Xuất hiện nhiều làng nghề, phường nghề thủ công.","Trình độ kĩ thuật được nâng cao."],"c":2},
    {"type":"mcq","q":"Địa danh nào thời Trần trở thành nơi buôn bán tấp nập, thu hút nhiều thuyền buôn và thương nhân nước ngoài đến trao đổi hàng hóa?","o":["Thăng Long.","Chương Dương.","Vân Đồn.","Phố Hiến."],"c":2},
    {"type":"mcq","q":"Tầng lớp thấp kém nhất trong xã hội thời Trần là","o":["nông dân.","thợ thủ công.","thương nhân.","nông nô, nô tì."],"c":3},
    {"type":"mcq","q":"Vì sao văn học thời Trần mang đậm tinh thần yêu nước và lòng tự hào dân tộc?","o":["Do nền kinh tế phát triển, tinh thần tự cường của dân tộc dâng cao.","Do đất nước liên tục phải đương đầu và giành chiến thắng trước các cuộc xâm lược của kẻ thù.","Do nền văn hóa dân tộc được xây dựng và phát triển mạnh.","Do Đại Việt vươn lên trở thành cường quốc hùng mạnh nhất Đông Nam Á."],"c":1},
    {"type":"mcq","q":"Năm 1054, vua Lý Thánh Tông đã đổi quốc hiệu thành","o":["Đại Cồ Việt.","Đại Nam.","Việt Nam.","Đại Việt."],"c":3},
    {"type":"mcq","q":"Hằng năm, các vua nhà Lý thực hiện lễ cày ruộng tịch điền nhằm mục đích gì?","o":["thúc đẩy sự phát triển của thủ công nghiệp.","khuyến khích nhân dân sản xuất nông nghiệp.","củng cố quyền lực của chính quyền trung ương.","thể hiện uy quyền và tài năng trị quốc của bản thân."],"c":1},
    {"type":"mcq","q":"Nhà Trần đã cho ban hành bộ luật nào?","o":["Hoàng Việt luật lệ.","Quốc triều hình luật.","Hoàng triều luật lệ.","Luật Hồng Đức."],"c":1},
    {"type":"mcq","q":"Vị thầy thuốc được mệnh danh là Ông tổ thuốc Nam và là người đầu tiên xây dựng nền y học truyền thống Việt Nam là","o":["Hải Thượng Lãn Ông.","Tuệ Tĩnh.","Tôn Thất Tùng.","Hồ Đắc Di."],"c":1},
    {"type":"mcq","q":"Quân dân nhà Trần đã phải kháng chiến chống quân xâm lược Mông – Nguyên bao nhiêu lần?","o":["1 lần.","2 lần.","3 lần.","4 lần."],"c":2},
    {"type":"mcq","q":"Để khích lệ tinh thần chiến đấu của các binh sĩ, Hưng Đạo Vương Trần Quốc Tuấn đã viết ra tác phẩm nào?","o":["Binh thư yếu lược.","Bình Ngô đại cáo.","Hịch tướng sĩ.","Nam quốc sơn hà."],"c":2}

    {"type":"mcq","q":"Đâu không phải là vai trò của ngành chăn nuôi trong nền kinh tế Việt Nam?","o":["Cung cấp thực phẩm cho con người.","Cung cấp sức kéo phục vụ tham quan, du lịch.","Cung cấp nguyên liệu (da, lông, sừng...) cho ngành công nghiệp nhẹ, phân bón phục vụ sản xuất nông nghiệp.","Cung cấp nguyên liệu cho ngành chế biến gỗ."],"c":3},
    {"type":"mcq","q":"Đâu không phải là sản phẩm của ngành chăn nuôi?","o":["Thịt gà","Thịt bò","Sữa đậu nành","Trứng vịt"],"c":2},
    {"type":"mcq","q":"Đâu không phải là triển vọng của ngành chăn nuôi ở Việt Nam?","o":["Chăn nuôi hữu cơ.","Người lao động chăn nuôi tự phối trộn thức ăn chăn nuôi.","Phát triển chăn nuôi trang trại, công nghiệp hoá, hiện đại hoá.","Liên kết giữa các khâu chăn nuôi, giết mổ và phân phối."],"c":1},
    {"type":"mcq","q":"Cần nuôi dưỡng và chăm sóc như thế nào để vật nuôi non khỏe mạnh, phát triển và kháng bệnh tốt?","o":["Cung cấp thức ăn có đủ năng lượng, protein, vitamin và chất khoáng.","Kiểm tra định kì thể trọng, tinh dịch của vật nuôi.","Thường xuyên tắm, chải cho vật nuôi non.","Cung cấp đủ calcium và các chất dinh dưỡng để tạo trứng."],"c":0},
    {"type":"mcq","q":"Chăm sóc, phòng và trị bệnh cho vật nuôi có ảnh hưởng như thế nào đến vật nuôi?","o":["Vật nuôi khỏe mạnh, phát triển toàn diện.","Vật nuôi thích nghi với điều kiện sống.","Vật nuôi dễ dàng tiêu thụ thức ăn.","Vật nuôi phát triển cân đối về ngoại hình."],"c":0},
    {"type":"mcq","q":"Đối với gà, vịt, con trống cần đạt tiêu chuẩn như thế nào?","o":["Lông óng mượt, màu sặc sỡ.","Cơ thể to, khỏe, mạnh mẽ, không quá béo hay quá gầy, nhanh nhẹn.","Chức năng miễn dịch tốt.","Tăng trọng tốt."],"c":1},
    {"type":"mcq","q":"Đối với lợn, bò, dê, yêu cầu đối với vật nuôi cái sinh sản là gì?","o":["Cơ thể không béo quá hay gầy quá.","Đủ sữa có thành phần dinh dưỡng tốt để nuôi con.","Có chức năng miễn dịch tốt, sức đề kháng cao.","Cơ thể khỏe mạnh, nhanh nhẹn."],"c":1},
    {"type":"mcq","q":"Vì sao phòng bệnh tốt hơn chữa bệnh?","o":["Đỡ tốn công.","Vật nuôi dễ quen với người chăn nuôi.","Đỡ tốn kém.","Đỡ tốn công và đỡ tốn kém."],"c":3},
    {"type":"mcq","q":"Ứng dụng công nghệ trong quản lí vật nuôi có lợi ích gì?","o":["Theo dõi được hoạt động thường ngày của người lao động chăn nuôi.","Quản lí được đàn vật nuôi với quy mô nhỏ, số lượng vật nuôi ít.","Nắm được tình trạng địa hình nơi đang chăn thả đàn vật nuôi.","Theo dõi được tình trạng sức khỏe, chu kì sinh sản,... của vật nuôi."],"c":3},
    {"type":"mcq","q":"Phương thức chăn nuôi bán chăn thả có đặc điểm gì?","o":["Vật nuôi đi lại tự do, không có chuồng trại.","Vật nuôi tự kiếm thức ăn có trong tự nhiên.","Vật nuôi sử dụng thức ăn công nghiệp kết hợp thức ăn tự tìm kiếm.","Vật nuôi chỉ sử dụng thức ăn, nước uống do người chăn nuôi cung cấp."],"c":2},
    {"type":"mcq","q":"Đâu không phải lí do chất thải và rác thải trong chăn nuôi gây ra?","o":["Gây ô nhiễm môi trường đất, nước và không khí.","Gây ra một số bệnh hô hấp, bệnh ngoài da ở người.","Ảnh hưởng đến môi trường sống của tôm, cua, cá.","Làm gia tăng số người mắc bệnh béo phì."],"c":3},
    {"type":"mcq","q":"Đâu là việc làm sai để phòng và điều trị bệnh cho vật nuôi?","o":["Tiêm phòng và điều trị bệnh kịp thời.","Cung cấp thức ăn đủ dinh dưỡng.","Cho vật nuôi vận động hợp lí.","Không tắm, chải, vệ sinh cho vật nuôi."],"c":3},
    {"type":"mcq","q":"Đâu không phải là nhiệm vụ của vật nuôi cái sinh sản ở giai đoạn nuôi con?","o":["Tiết nhiều sữa có chất lượng tốt để nuôi con.","Nuôi con khỏe mạnh.","Vật nuôi non không phát sinh các bệnh về hô hấp.","Nuôi con có tỉ lệ sống cao."],"c":2},
    {"type":"mcq","q":"Đâu không phải là yêu cầu đối với vật nuôi đực giống là lợn, bò, dê?","o":["Cơ thể cân đối, rắn chắc, không béo quá hay gầy quá.","Có sức đề kháng cao.","Tăng trọng tốt.","Có số lượng và chất lượng tinh dịch tốt."],"c":1},
    {"type":"mcq","q":"Đâu không phải đặc điểm cơ thể vật nuôi non?","o":["Sự điều tiết thân nhiệt chưa hoàn chỉnh.","Chức năng của hệ tiêu hóa chưa hoàn chỉnh.","Có sức khỏe và sức đề kháng khá tốt.","Chức năng miễn dịch chưa tốt."],"c":2},
    {"type":"mcq","q":"Những yếu tố ít ảnh hưởng đến sự phát triển của vật nuôi là:","o":["Nuôi dưỡng vật nuôi.","Chăm sóc vật nuôi.","Phòng, trị bệnh cho vật nuôi.","Loại cây trồng lấy bóng mát cho bãi chăn thả."],"c":3},
    {"type":"mcq","q":"Phát biểu sai về đặc điểm chăn nuôi theo phương thức chăn thả:","o":["Vật nuôi sử dụng thức ăn do người chăn nuôi cung cấp.","Kĩ thuật chăn nuôi đơn giản.","Phụ thuộc vào nguồn thức ăn có trong tự nhiên.","Không có chuồng trại cho vật nuôi."],"c":0},
    {"type":"mcq","q":"Những loại vật nuôi phù hợp với phương thức nuôi công nghiệp là:","o":["Gà, vịt, lợn.","Trâu, bò.","Ong.","Cừu, dê."],"c":0},

    { type:'mcq', q:'Ta nghe được tiếng vang khi', o:['âm phản xạ đến tai ta chậm hơn âm trực tiếp một khoảng thời gian ít nhất là 1/15 giây.','âm phản xạ đến tai ta chậm hơn âm trực tiếp một khoảng thời gian ít nhất là 15 giây.','âm phản xạ đến tai ta nhanh hơn âm trực tiếp một khoảng thời gian ít nhất là 1/15 giây.','âm phản xạ đến tai ta nhanh hơn âm trực tiếp một khoảng thời gian ít nhất là 15 giây.'], c:0 },

    { type:'mcq', q:'Phát biểu nào sau đây là không đúng?', o:['Trong hang động ta nói to thì có âm phản xạ.','Mọi âm thanh gặp vật chắn đều bị phản xạ trở lại.','Không có vật chắn vẫn có âm phản xạ.','Cùng môi trường, vận tốc phản xạ bằng vận tốc truyền âm.'], c:2 },
    { type:'mcq', q:'Phát biểu nào sau đây là đúng?', o:['Trong hang động ta nói to thì có âm phản xạ.','Không phải âm thanh nào gặp vật chắn đều bị phản xạ trở lại.','Không có vật chắn vẫn có âm phản xạ.','Cùng môi trường, vận tốc phản xạ nhỏ vận tốc truyền âm.'], c:0 },

    { type:'mcq', q:'Những vật nào sau đây phản xạ âm tốt?', o:['Mặt tường gồ ghề, mặt nền trải thảm.','Tấm lụa trải phẳng, áo len, áo mút.','Vải bông, nhung, gấm.','Mặt kính, tường phẳng.'], c:3 },

    { type:'mcq', q:'Chọn câu đúng.', o:['Vật hấp thụ âm tốt thì cũng phản xạ âm tốt.','Âm thanh khi phản xạ luôn truyền tới tai người nghe.','Các vật có bề mặt cứng, nhẵn không phản xạ âm.','Sự phản xạ âm đóng vai trò khuếch đại âm, nếu âm phản xạ đến tai người nghe cùng một lúc với âm phát ra.'], c:3 },
    { type:'mcq', q:'Trong những vật sau đây: miếng xốp, ghế nệm, mặt gương, tấm kim loại, áo len, cao su xốp, mặt đá hoa, tường gạch. Vật phản xạ âm tốt là', o:['Miếng xốp, ghế nệm, mặt gương.','Tấm kim loại, áo len, cao su.','Mặt gương, tấm kim loại, mặt đá hoa, tường gạch.','Miếng xốp, ghế nệm, cao su xốp.'], c:2 },

    { type:'mcq', q:'Hãy xác định câu đúng trong các câu sau đây.', o:['Những vật có bề mặt nhẵn, cứng phản xạ âm tốt.','Bức tường càng dày phản xạ âm càng tốt.','Những vật có bề mặt mềm, gồ ghề hấp thụ âm kém.','Khi gặp bề mặt xù xì, âm truyền qua hoàn toàn, không bị phản xạ.'], c:0 },

    { type:'mcq', q:'Sống trong một khu dân cư bị ô nhiễm tiếng ồn do tàu hỏa gây ra. Để em bé của mình không bị thức giấc mỗi khi tàu hỏa chạy qua, bạn Linh đề nghị với bố mẹ các cách sau, em hãy giúp bố mẹ Linh chọn cách thích hợp nhất.', o:['Chuyển nhà nơi khác không bị ô nhiễm tiếng ồn.','Không cho tàu hỏa đi ngang qua nơi mình ở.','Bịt tai em bé lại mỗi khi tàu đi qua.','Xây dựng tường cách âm.'], c:3 },
    { type:'mcq', q:'Loại cửa kính có hai lớp kính có khả năng cách âm tốt hơn rất nhiều so với loại cửa kính chỉ có một lớp kính. Tại sao?', o:['Vì hai lớp thì dày hơn một lớp nên âm khó truyền qua hơn.','Vì kính hai lớp có chất lượng tốt hơn.','Vì giữa hai lớp kính có lớp không khí nên cách âm tốt hơn.','Vì cửa một lớp thường xuyên đóng mở nên khả năng cách âm kém hơn.'], c:2 },
    { type:'mcq', q:'Khi sử dụng gạch có lỗ thì khả năng cách âm tốt hơn so với gạch đúc. Lí giải nào sau đây là đúng nhất?', o:['Gạch có lỗ dày hơn gạch đặc.','Vật liệu làm gạch có lỗ truyền âm kém hơn gạch đặc.','Gạch có lỗ khô hơn gạch đặc nên truyền âm chậm hơn.','Các lỗ gạch chứa không khí nên cách âm tốt hơn.'], c:3 },
    { type:'mcq', q:'Vì sao ta nhìn thấy một vật?', o:['Vì ta mở mắt hướng về phía vật.','Vì mắt ta phát ra các tia sáng chiếu lên vật.','Vì có ánh sáng từ vật truyền vào mắt ta.','Vì vật được chiếu sáng.'], c:2 },

    { type:'mcq', q:'Hiện tượng nào sau đây không liên quan đến năng lượng ánh sáng?', o:['Ánh sáng mặt trời phản chiếu trên mặt nước.','Ánh sáng mặt trời làm cháy bỏng da.','Bếp mặt trời nóng lên nhờ ánh sáng mặt trời.','Ánh sáng mặt trời dùng để tạo điện năng.'], c:0 },
    { type:'mcq', q:'Vật nào dưới đây không phải là vật sáng?', o:['Mảnh giấy trắng đặt dưới ánh nắng Mặt Trời.','Ngọn nến đang cháy.','Mảnh giấy đen đặt dưới ánh nắng Mặt Trời.','Mặt Trời.'], c:2 },
    { type:'mcq', q:'Trường hợp nào dưới đây ta không nhận biết được một miếng bìa màu đen?', o:['Dán miếng bìa đen lên một tờ giấy xanh rồi đặt dưới ánh đèn điện.','Dán miếng bìa đen lên một tờ giấy trắng rồi đặt trong phòng tối.','Đặt miếng bìa đen trước một ngọn nến đang cháy.','Đặt miếng bìa đen ngoài trời nắng.'], c:1 },
    { type:'mcq', q:'Ta nhìn thấy bông hoa màu đỏ vì', o:['bản thân bông hoa có màu đỏ.','bông hoa là một vật sáng.','bông hoa là một nguồn sáng.','có ánh sáng đỏ từ bông hoa truyền đến mắt ta.'], c:3 },
    { type:'mcq', q:'Ban ngày trời nắng, dùng một gương phẳng hứng ánh sáng Mặt Trời, rồi xoay gương chiếu ánh nắng qua cửa sổ vào trong phòng. Gương đó có phải là nguồn sáng không? Tại sao?', o:['Là nguồn sáng vì có ánh sáng từ gương chiếu vào phòng.','Là nguồn sáng vì gương hắt ánh sáng Mặt Trời chiếu vào phòng.','Không phải là nguồn sáng vì gương chỉ chiếu ánh sáng theo một hướng.','Không phải là nguồn sáng vì gương không tự phát ra ánh sáng.'], c:3 },
    { type:'mcq', q:'Chiếu một chùm ánh sáng hẹp vào mặt một tấm gỗ phẳng. Hiện tượng nào sau đây sẽ xảy ra?', o:['Ánh sáng truyền xuyên qua tấm gỗ.','Ánh sáng đi vòng qua tấm gỗ theo đường cong.','Ánh sáng đi vòng qua tấm gỗ theo đường gấp khúc.','Ánh sáng không truyền qua được tấm gỗ.'], c:3 },

    let currentSubject = null;

      totalAnswered: 0,  // Tổng số câu đã trả lời
      totalCorrect: 0    // Tổng số câu trả lời đúng
    };

    let userAnswers = []; // for each question:
    // - for mcq: userAnswers[i] = selectedIndex|null
    // - for tf: userAnswers[i] = [true/false|null, true/false|null, ...] (length 4)

    // UI refs
    const subjectScreen = document.getElementById('subjectScreen');
    const modeScreen = document.getElementById('modeScreen');
    const quizScreen = document.getElementById('quizScreen');

    const quizContent = document.getElementById('quizContent');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnNext = document.getElementById('btnNext');

    const resultScoreLarge = document.getElementById('resultScoreLarge');

    const resultRemark = document.getElementById('resultRemark');
    const resultRestart = document.getElementById('resultRestart');
    const resultHome = document.getElementById('resultHome');

    // helpers
    // Function để chuyển link hình trong câu hỏi thành thẻ img
    function processQuestionText(text) {
      // Tìm tất cả các URL hình ảnh (http:// hoặc https://)
      // Hỗ trợ các định dạng: .jpg, .jpeg, .png, .gif, .webp, .svg
      const imageUrlPattern = /(https?:\/\/[^\s<>"]+?\.(jpg|jpeg|png|gif|webp|svg|bmp))/gi;
      
      return text.replace(imageUrlPattern, (url) => {
        return `<br><img src="${url}" alt="Hình minh họa" class="max-w-full h-auto rounded-lg shadow-md my-3 mx-auto block" style="max-height: 400px;" />`;
      });
    }
    
    function shuffleArray(array) {
      const arr = array.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function shuffleOptionsForMCQ(question) {
      // returns a copy (qObj) with shuffled o and updated c
      if (question.type !== 'mcq') return JSON.parse(JSON.stringify(question));
      const opts = question.o.map((t, idx) => ({ t, idx }));
      const sh = shuffleArray(opts);
      const newQ = {
        type: 'mcq',
        q: question.q,
        o: sh.map(x => x.t),
        c: sh.findIndex(x => x.idx === question.c),
        hint: question.hint || null,
        explain: question.explain || null
      };
      return newQ;
    }

    // initialize quiz
    function initializeQuiz(mode = 'full', customCount = null) {
      const allQ = subjectData[currentSubject].questions;
      if (mode === 'full') {
        // Nếu có customCount thì dùng, không thì lấy tất cả
        let questionCount = customCount || allQ.length;
        
        // Validate số câu hỏi
        if (questionCount < 1) questionCount = 1;
        if (questionCount > allQ.length) questionCount = allQ.length;
        
        // Lưu số câu hợp lệ
        lastValidQuestionCount = questionCount;
        
        // Shuffle và lấy số câu hỏi theo yêu cầu
        const shuffled = shuffleArray(allQ).slice(0, questionCount).map(q => {
          if (q.type === 'mcq') return shuffleOptionsForMCQ(q);
          else return JSON.parse(JSON.stringify(q)); // tf unchanged
        });
        shuffledQuestions = shuffled;
        userAnswers = shuffledQuestions.map(q => q.type === 'mcq' ? null : [null, null, null, null]);
      } else {
        if (allQ.length === 0) {
          alert('Không có câu hỏi.');
          return;
        }
        const q = allQ[Math.floor(Math.random() * allQ.length)];
        shuffledQuestions = (q.type === 'mcq') ? [shuffleOptionsForMCQ(q)] : [JSON.parse(JSON.stringify(q))];
        userAnswers = [ (shuffledQuestions[0].type === 'mcq') ? null : [null,null,null,null] ];
      }
      quizMode = mode;
      quizStarted = true;
      quizCompleted = false;
      score = 0;
      hintsUsed = {};
      randomHintUsed = false;
      renderQuiz();
    }

    // Render quiz screen
    function renderQuiz() {
      if (!currentSubject) {
        subjectScreen.classList.remove('hidden');
        modeScreen.classList.add('hidden');
        quizScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        return;
      }
      if (!quizStarted) {
        subjectScreen.classList.add('hidden');
        modeScreen.classList.remove('hidden');
        quizScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        return;
      }
      subjectScreen.classList.add('hidden');
      modeScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      resultScreen.classList.add('hidden');

      // Hiển thị/ẩn input số câu và nút áp dụng nếu là mode full
      const customQuestionInput = document.getElementById('customQuestionInput');
      const applyCustomCountBtn = document.getElementById('applyCustomCount');
      const quizHeader = document.getElementById('quizHeader');
      
      if (quizMode === 'full') {
        customQuestionInput.classList.remove('hidden');
        customQuestionInput.classList.add('flex');
        applyCustomCountBtn.classList.remove('hidden');
        quizHeader.classList.remove('justify-between');
        quizHeader.classList.add('flex-wrap');
      } else {
        customQuestionInput.classList.add('hidden');
        customQuestionInput.classList.remove('flex');
        applyCustomCountBtn.classList.add('hidden');
        quizHeader.classList.remove('flex-wrap');
        quizHeader.classList.add('justify-between');
      }

      // Hiện/ẩn nút Gợi ý (chỉ với môn có hint, và chưa completed)
      const btnHintEl = document.getElementById('btnHint');
      const hasHints = shuffledQuestions.length > 0 && !!shuffledQuestions[0].hint;
      if (hasHints && !quizCompleted) {
        btnHintEl.style.display = (quizMode === 'random') ? 'flex' : 'none';
        if (quizMode === 'random') {
          document.getElementById('btnHintLabel').textContent = randomHintUsed ? 'Ẩn gợi ý' : 'Gợi ý';
        }
      } else {
        btnHintEl.style.display = 'none';
      }

      // header info
      const totalQuestions = shuffledQuestions.length;
      if (quizMode === 'full') {
        countInfo.textContent = `Tổng ${totalQuestions} câu`;
        const answeredCount = shuffledQuestions.reduce((acc, q, i) => {
          if (q.type === 'mcq') return acc + (userAnswers[i] !== null ? 1 : 0);
          else {
            return acc + (userAnswers[i].some(x => x !== null) ? 1 : 0);
          }
        }, 0);
        scoreInfo.textContent = `Đã trả lời: ${answeredCount}/${totalQuestions}`;
        const pct = Math.round((answeredCount/Math.max(1,totalQuestions))*100);
        progressFill.style.width = pct + '%';
      } else {
        // Mode random: không hiển thị countInfo, chỉ hiển thị số câu đúng/tổng đã trả lời
        countInfo.textContent = '';
        scoreInfo.textContent = `Đúng: ${randomModeStats.totalCorrect}/${randomModeStats.totalAnswered}`;
        progressFill.style.width = '0%';
      }

                } else {
                  userAnswers[qi][sidx] = false;
                  btnFalse.classList.add('bg-blue-50','border-blue-500');
                  btnTrue.classList.remove('bg-blue-50','border-blue-500');
                }
                const answeredCount = shuffledQuestions.reduce((acc, q2, i2) => {
                  if (q2.type === 'mcq') return acc + (userAnswers[i2] !== null ? 1 : 0);
                  else return acc + (userAnswers[i2].some(x=>x!==null) ? 1 : 0);

    // Submit button helper
    function setSubmitState(enabled, text) {
      if (enabled) {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove('cursor-not-allowed','bg-gray-300','text-gray-500');
        btnSubmit.classList.add('bg-blue-600','text-white');
      } else {
        btnSubmit.disabled = true;
        btnSubmit.classList.add('cursor-not-allowed','bg-gray-300','text-gray-500');
        btnSubmit.classList.remove('bg-blue-600','text-white');
      }
      if (text) btnSubmit.textContent = text;
    }

    // grading helper for TF question: counts correct sub-items and maps to points
    function tfPointsForCorrectCount(n) {
      if (n <= 0) return 0;
      if (n === 1) return 0.1;
      if (n === 2) return 0.25;
      if (n === 3) return 0.5;
      if (n === 4) return 1;
      return 0;
    }

    // Submit handler
    btnSubmit.addEventListener('click', () => {
      if (!quizStarted) return;
      if (btnSubmit.disabled && quizCompleted) return;

      const confirmMsg = 'Bạn có chắc muốn nộp bài? Sau khi nộp sẽ không thể thay đổi đáp án.';
      const warningToggle = document.getElementById('warningToggle');
      const warningsEnabled = warningToggle ? warningToggle.checked : true;
      if (warningsEnabled) {
        if (!confirm(confirmMsg)) return;
      }

      if (quizMode === 'full') {
        const anyAnswered = userAnswers.some(x => (Array.isArray(x) ? x.some(v=>v!==null) : x !== null));
        if (!anyAnswered) return;

        let totalPoints = 0;
        let totalPossible = 0;
        shuffledQuestions.forEach((q, i) => {
          if (hintsUsed[i]) return; // skip hinted questions
          if (q.type === 'mcq') {
            totalPossible += 1;
            if (userAnswers[i] === q.c) totalPoints += 1;
          } else if (q.type === 'tf') {
            totalPossible += 1;
            const correctArr = q.answers;
            const userArr = userAnswers[i];
            let correctCount = 0;
            for (let j=0;j<4;j++){
              if (userArr[j] === null) continue;
              if (userArr[j] === correctArr[j]) correctCount++;
            }
            totalPoints += tfPointsForCorrectCount(correctCount);
          }
        });

        score = totalPoints;
        quizCompleted = true;
        // hide hint button
        document.getElementById('btnHint').style.display = 'none';

        quizContent.innerHTML = '';
        const summary = document.createElement('div');
        summary.className = 'mb-6 p-4 rounded-lg border bg-gray-50';
        const pct = totalPossible > 0 ? Math.round((totalPoints/totalPossible)*100) : 0;
        const hintedCount = Object.keys(hintsUsed).length;
        summary.innerHTML = `<div class="text-center">
          <div class="text-3xl font-bold text-blue-600">${Math.round(totalPoints*100)/100}/${totalPossible}</div>
          <div class="text-lg text-gray-600">Điểm số: ${pct}%</div>
          ${hintedCount > 0 ? `<div class="text-sm text-red-500 mt-1">⚠️ ${hintedCount} câu đã dùng gợi ý (không tính điểm)</div>` : ''}
        </div>`;
        quizContent.appendChild(summary);

        shuffledQuestions.forEach((q, qi) => {
          const qWrap = document.createElement('div');
          qWrap.className = 'mb-6 pb-4 border-b';
          const qTitle = document.createElement('h3');
          qTitle.className = 'text-lg font-semibold mb-3';
          qTitle.innerHTML = `Câu ${qi+1}. ${processQuestionText(q.q)}`;
          qWrap.appendChild(qTitle);

          // Show hint-used notice
          if (hintsUsed[qi]) {
            const hw = document.createElement('div');
            hw.className = 'mb-2 text-xs text-red-500 font-semibold';
            hw.textContent = '⚠️ Câu này đã dùng gợi ý — không tính điểm.';
            qWrap.appendChild(hw);
          }

          if (q.type === 'mcq') {
            const opts = document.createElement('div');
            opts.className = 'space-y-2';
            q.o.forEach((opt, oi) => {
              const div = document.createElement('div');
              div.className = 'w-full text-left p-3 rounded-lg border-2 transition-all mb-1 flex items-center justify-between';
              if (oi === q.c) {
                if (userAnswers[qi] === q.c) {
                  div.classList.add('border-green-500','bg-green-50');
                  div.innerHTML = `<span class="font-medium text-gray-800">${opt}</span><span class="text-green-700 font-semibold">✓ ĐÚNG</span>`;
                } else {
                  div.classList.add('border-green-300','bg-green-50');
                  div.innerHTML = `<span class="font-medium text-gray-800">${opt}</span><span class="text-green-600">Đáp án đúng</span>`;

              } else if (userAnswers[qi] === oi) {
                div.classList.add('border-red-500','bg-red-50');

              } else if (userVal === correct) {
                div.classList.add('border-green-500','bg-green-50');
                div.innerHTML = `<div class="font-medium text-gray-800">${stmt}</div><div class="text-green-700 font-semibold">Bạn chọn: ${userVal ? 'ĐÚNG' : 'SAI'}</div>`;
              } else {
                div.classList.add('border-red-500','bg-red-50');

              list.appendChild(div);
            });
            let correctCount = 0;
            for (let j=0;j<4;j++) if (userAnswers[qi][j] !== null && userAnswers[qi][j] === q.answers[j]) correctCount++;
            const pts = tfPointsForCorrectCount(correctCount);
            const ptsDiv = document.createElement('div');
            ptsDiv.className = 'mt-2 text-sm text-gray-700 font-semibold';

        btnNext.classList.add('hidden');

              div.classList.add('border-gray-200');
              div.innerHTML = `<span class="font-medium text-gray-800">${opt}</span><span class="icon-area"></span>`;

            opts.appendChild(div);
          });
          qWrap.appendChild(opts);
          if (randomHintUsed) {

// Khai báo biến ở global scope
let database, presenceRef, myPresenceRef;

// Khởi tạo Firebase với error handling
try {
  firebase.initializeApp(firebaseConfig);
  database = firebase.database();
  presenceRef = database.ref('presence');
  console.log('✅ Firebase đã khởi tạo thành công');
} catch (error) {
  console.error('❌ Lỗi khởi tạo Firebase:', error);

  console.log('   2. Database URL đúng chưa');
  console.log('   3. Project ID đúng chưa');
}

// Tạo ID duy nhất cho TRÌNH DUYỆT
let browserId = localStorage.getItem('browserId');
if (!browserId) {
  browserId = 'browser_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  localStorage.setItem('browserId', browserId);
}

const tabId = 'tab_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
const tabsKey = 'activeTabs_' + browserId;
let activeTabs = JSON.parse(localStorage.getItem(tabsKey) || '[]');
activeTabs.push(tabId);
localStorage.setItem(tabsKey, JSON.stringify(activeTabs));

// Kiểm tra presenceRef có khả dụng không
if (!presenceRef) {
  console.error('❌ presenceRef không khả dụng. Firebase chưa được khởi tạo đúng.');
  const onlineCountEl = document.getElementById('onlineCount');
  if (onlineCountEl) {
    onlineCountEl.textContent = '?';
  }
} else {
  myPresenceRef = presenceRef.child(browserId);
  
  // Chỉ set online nếu đây là tab đầu tiên
  if (activeTabs.length === 1) {
    myPresenceRef.set({
      online: true,
      timestamp: Date.now()
    }).then(() => {
      console.log('✅ Đã đăng ký online thành công');
    }).catch(error => {
      console.error('❌ Lỗi khi set presence:', error);
      if (error.code === 'PERMISSION_DENIED') {
        console.error('🚨 LỖI: Firebase Database Rules chưa cho phép write!');
        console.log('📝 Hướng dẫn sửa:');
        console.log('   1. Vào https://console.firebase.google.com');
        console.log('   2. Chọn project "bruh-68680"');
        console.log('   3. Vào Realtime Database > Rules');
        console.log('   4. Đổi rules thành:');
        console.log('      {');
        console.log('        "rules": {');
        console.log('          ".read": true,');
        console.log('          ".write": true');
        console.log('        }');
        console.log('      }');
        console.log('   5. Nhấn Publish');
      }
    });
  }

  // Đánh dấu offline khi rời trang
  myPresenceRef.onDisconnect().remove();

  // Lắng nghe số người online với error handling
  presenceRef.on('value', (snapshot) => {
    const onlineUsers = snapshot.numChildren();
    const onlineCountEl = document.getElementById('onlineCount');
    if (onlineCountEl) {
      onlineCountEl.textContent = onlineUsers;
    }
    console.log('👥 Số người online:', onlineUsers);
  }, (error) => {
    console.error('❌ Lỗi khi đọc presence data:', error);
    if (error.code === 'PERMISSION_DENIED') {
      console.error('🚨 LỖI: Firebase Database Rules chưa cho phép read!');
      console.log('📝 Xem hướng dẫn sửa lỗi bên trên');
      
      // Hiển thị thông báo lỗi cho user
      const onlineCountEl = document.getElementById('onlineCount');
      if (onlineCountEl) {
        onlineCountEl.textContent = '?';
        onlineCountEl.parentElement.title = 'Lỗi kết nối Firebase. Vui lòng kiểm tra Database Rules.';
      }
    }
  });

  // Cleanup khi tắt tab
  window.addEventListener('beforeunload', () => {
    // Xóa tab này khỏi danh sách
    let tabs = JSON.parse(localStorage.getItem(tabsKey) || '[]');
    tabs = tabs.filter(id => id !== tabId);
    localStorage.setItem(tabsKey, JSON.stringify(tabs));
    
    // Chỉ remove presence nếu không còn tab nào
    if (tabs.length === 0 && myPresenceRef) {
      myPresenceRef.remove();
      localStorage.removeItem('browserId');
      localStorage.removeItem(tabsKey);
    }
  });

  // Heartbeat để cleanup các tab zombie
  setInterval(() => {
    if (!myPresenceRef) return;
    
    let tabs = JSON.parse(localStorage.getItem(tabsKey) || '[]');
    // Giữ tab hiện tại trong danh sách
    if (!tabs.includes(tabId)) {
      tabs.push(tabId);
      localStorage.setItem(tabsKey, JSON.stringify(tabs));
    }
    
    // Cập nhật timestamp để giữ kết nối
    if (tabs.length > 0) {
      myPresenceRef.set({
        online: true,
        timestamp: Date.now()
      });
    }
  }, 1000); // THỜI GIAN ĐỂ CẬP NHẬT SỐ NGƯỜI 

  // Xử lý khi tab bị ẩn
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && myPresenceRef) {
      // Khi quay lại tab, đảm bảo presence vẫn còn
      let tabs = JSON.parse(localStorage.getItem(tabsKey) || '[]');
      if (tabs.length > 0) {
        myPresenceRef.set({
          online: true,
          timestamp: Date.now()
        });
      }
    }
  });

  // Function để clean up presence data cũ (chỉ xóa data quá 1 phút)
  window.cleanupOldPresence = function() {
    if (!presenceRef) {
      console.error('presenceRef không khả dụng');
      return;
    }
    presenceRef.once('value', (snapshot) => {
      const now = Date.now();
      const oneMinuteAgo = now - 10000;
      
      snapshot.forEach((childSnapshot) => {
        const data = childSnapshot.val();
        if (data && data.timestamp < oneMinuteAgo) {
          childSnapshot.ref.remove();
          console.log('Đã xóa presence cũ:', childSnapshot.key);
        }
      });
      
      console.log('✅ Đã dọn dẹp presence data cũ');
    });
  };

  // Function reset toàn bộ (CHỈ dùng khi cần thiết)
  window.resetOnlineCount = function() {
    if (!firebase || !firebase.database) {
      console.error('Firebase không khả dụng');
      return;
    }
    
    if (!confirm('⚠️ Thao tác này sẽ reset TẤT CẢ người online về 0. Bạn có chắc chắn?')) {
      return;
    }
    
    firebase.database().ref('presence').remove().then(() => {
      console.log('Bước 1: Đã xóa toàn bộ presence data.');
      
      setTimeout(() => {
        const browserId = localStorage.getItem('browserId');
        if (browserId && myPresenceRef) {
          myPresenceRef.set({
            online: true,
            timestamp: Date.now()
          }).then(() => {
            console.log('Bước 2: Đã đăng ký lại. Số người online sẽ hiển thị 1 sau vài giây.');
          });
        }
      }, 1000);
    }).catch(error => {
      console.error('Lỗi:', error);
    });
  };

  // Tự động cleanup presence data cũ khi tải trang
  setTimeout(() => {
    if (window.cleanupOldPresence) {
      window.cleanupOldPresence();
    }
  }, 2000);
}

console.log('💡 Lệnh hữu ích:');
console.log('   - cleanupOldPresence() : Xóa presence data cũ hơn 1 phút');
console.log('   - resetOnlineCount() : Reset toàn bộ (cẩn thận!)');
</script>
