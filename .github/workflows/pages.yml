name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create version.json
        run: |
          echo "{\"version\":\"$(date -u +'%Y-%m-%dT%H-%M-%S')\"}" > version.json

      - name: Prepare site folder
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/
          cp version.json _site/
          # Nếu sau này có thêm file css/js/image thì copy thêm vào đây

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
